<!DOCTYPE html>
<html lang="ja" class="is-scrolled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Illustration — Yona</title>
  <meta name="description" content="オリジナルのキャラクターイラストのギャラリーです。">
  <!-- ファビコン(ブラウザのタブのアイコン)。画像は images/favicon.svg と favicon.ico / iPhoneのホーム画面用は images/apple-touch-icon.png -->
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Zen+Kaku+Gothic+New:wght@400;500&family=Zen+Old+Mincho:wght@400;500&family=DM+Mono:wght@300;400;500&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/work-detail.css">
</head>
<body>
  <!-- =============================================================
       作品ページ No.08(イラスト ギャラリー)
       ・説明なしで、イラストを並べて見せるページ。押すと大きく表示される(js/work-detail.js)
       ・増やすときは <figure class="piece__fig gallery__item"> を1つ分コピーして、src を書き換える
       ・画像は images/works/detail/08-illustration-番号-名前.jpg
       ============================================================= -->

  <!-- ===== ヘッダー(トップと同じ) ===== -->
  <header class="site-header">
    <a class="site-logo" href="index.html"><img src="images/logo-hero.svg" alt="Yona" width="247" height="74"></a>
    <nav class="site-nav" aria-label="メインメニュー">
      <a href="index.html" data-nav="top">Home</a>
      <a href="index.html#work-08" data-nav="works" class="is-current">Works</a>
      <a href="index.html#about" data-nav="about">About</a>
      <a href="index.html#sns" data-nav="sns">SNS</a>
    </nav>
  </header>

  <!-- ===== 画面のふちの飾り(固定) ===== -->
  <div class="frame" aria-hidden="true">
    <span class="frame__plus" style="--x: 0; --y: 34%"></span>
    <span class="frame__plus" style="--x: 0; --y: 70%"></span>
    <span class="frame__plus" style="--x: 1; --y: 34%"></span>
    <span class="frame__plus" style="--x: 1; --y: 70%"></span>
    <span class="frame__v frame__v--l">ポートフォリオ</span>
    <span class="frame__v frame__v--r">つくることの記録</span>
    <span class="frame__index"><b>08</b><i></i><span>Gallery</span></span>
  </div>

  <main class="content content--page">
    <section class="section">
      <header class="sec-head detail-head">
        <p class="sec-head__label" data-reveal><a class="back" href="index.html#work-08">← Back</a>(GALLERY No.08) <span>2026</span></p>
        <h1 class="sec-head__title" data-reveal>Illustration</h1>
        <p class="sec-head__count" data-reveal><b>04</b><span>ITEMS /<br>No.08</span></p>
        <p class="sec-head__v" aria-hidden="true">いらすと</p>
      </header>

      <p class="gallery__lead" data-reveal><span class="tagbox">ILLUSTRATION</span><span class="gallery__note">画像を押すと大きく表示されます</span></p>

      <!-- イラストのギャラリー(大きさの違う絵を、すき間なく積み上げる) -->
      <div class="gallery">
          <figure class="piece__fig gallery__item" data-reveal>
            <div class="detail__frame" data-label="IMAGE 01">
              <img src="images/works/detail/08-illustration-1-girl.jpg" alt="イラスト1" loading="lazy" data-detail-img>
            </div>
          </figure>
          <figure class="piece__fig gallery__item" data-reveal>
            <div class="detail__frame" data-label="IMAGE 02">
              <img src="images/works/detail/08-illustration-2-white.jpg" alt="イラスト2" loading="lazy" data-detail-img>
            </div>
          </figure>
          <figure class="piece__fig gallery__item" data-reveal>
            <div class="detail__frame" data-label="IMAGE 03">
              <img src="images/works/detail/08-illustration-3-space.jpg" alt="イラスト3" loading="lazy" data-detail-img>
            </div>
          </figure>
          <figure class="piece__fig gallery__item" data-reveal>
            <div class="detail__frame" data-label="IMAGE 04">
              <img src="images/works/detail/08-illustration-4-garland.jpg" alt="イラスト4" loading="lazy" data-detail-img>
            </div>
          </figure>
      </div>

      <!-- ほかの作品へ -->
      <nav class="detail-pager" aria-label="ほかの作品" data-reveal>
        <a href="work-05.html"><small>← PREV / No.05</small><b>3D Objects</b></a>
        <a href="work-02.html"><small>NEXT / No.02 →</small><b>Banner & Web</b></a>
      </nav>
      <div class="detail-back" data-reveal>
        <a class="btn btn--ink btn--flip" href="index.html#work-08"><span class="btn__roll"><span>← Back to works</span><span aria-hidden="true">← Back to works</span></span></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__copy">© <span data-year></span> Yona</p>
    <span class="site-footer__bars" aria-hidden="true"></span>
    <p class="site-footer__thanks">THANK YOU FOR VISITING</p>
    <a class="site-footer__top" href="#">BACK TO TOP <i>↑</i></a>
  </footer>

  <script src="js/work-detail.js"></script>

</html>
